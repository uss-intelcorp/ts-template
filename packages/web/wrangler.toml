name = "ts-template"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "ts-template"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../core/migrations"

[vars]
APP_NAME = "TS Template"

[[queues.producers]]
binding = "JOB_QUEUE"
queue = "ts-template-jobs"

[[queues.consumers]]
queue = "ts-template-jobs"
max_batch_size = 10
max_batch_timeout = 5

[observability]
enabled = true
